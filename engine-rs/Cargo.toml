[package]
name = "veritas-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic combinational engine for Veritas"
license = "MIT"
rust-version = "1.75"

[lib]
name = "veritas_engine"
path = "src/lib.rs"

[[bench]]
name = "throughput"
harness = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
