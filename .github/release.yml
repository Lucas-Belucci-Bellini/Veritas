changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: 'Breaking changes'
      labels:
        - breaking-change
        - semver-major
    - title: 'Features'
      labels:
        - feature
        - enhancement
        - semver-minor
    - title: 'Bug fixes'
      labels:
        - bug
        - fix
    - title: 'Security and privacy'
      labels:
        - security
        - privacy
    - title: 'Documentation and education'
      labels:
        - documentation
        - education
    - title: 'Other changes'
      labels:
        - '*'
