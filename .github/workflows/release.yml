name: Veritas release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer com prefixo v, por exemplo v0.8.0-rc.1 ou v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release no GitHub'
        required: true
        default: true
        type: boolean

concurrency:
  group: veritas-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$REF_NAME"
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
          else
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Validando $version (prerelease=$prerelease)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Validate version and tag source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $VERSION"
            echo 'Use v0.8.0-rc.1 ou v1.0.0.'
            exit 1
          fi
          if [[ "$PRERELEASE" == "true" && "$VERSION" != *-* ]]; then
            echo 'Uma release marcada como prerelease precisa conter sufixo como -alpha.1, -beta.1 ou -rc.1.'
            exit 1
          fi
          if [[ "$PRERELEASE" == "false" && "$VERSION" == *-* ]]; then
            echo 'Uma versão com sufixo prerelease precisa ser marcada como prerelease.'
            exit 1
          fi
          declared_version="$(node -p "require('./package.json').version")"
          expected_version="${VERSION#v}"
          if [[ "$declared_version" != "$expected_version" ]]; then
            echo "package.json declara $declared_version, mas a promoção solicita $VERSION."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$COMMIT_SHA" ]]; then
              echo "A tag $VERSION não aponta para o commit do workflow."
              exit 1
            fi
          elif git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "A tag $VERSION já existe."
            exit 1
          fi

      - name: Guard beta promotion
        if: contains(steps.metadata.outputs.version, '-beta.')
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_PREFLIGHT_STRICT: '1'
          RELEASE_EVIDENCE_STATUS: ${{ vars.VERITAS_BETA_EVIDENCE_STATUS }}
          RELEASE_BETA_APPROVED: ${{ vars.VERITAS_BETA_APPROVED }}
        run: npm run release:guard

      - name: Test suite
        run: npm test -- --run

      - name: Rust engine acceptance
        run: npm run beta:rust

      - name: WASM readiness acceptance
        run: npm run beta:wasm

      - name: TypeScript/Rust controlled benchmark
        run: npm run bench:compare

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build MCP
        run: npm run build:mcp

      - name: Build MCP HTTP
        run: npm run build:mcp:http

      - name: MCP HTTP interoperability acceptance
        run: npm run beta:mcp:http

      - name: Preview and smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/veritas-release-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_URL=http://127.0.0.1:4173 npm run smoke:release

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-release-preview-log-${{ github.run_id }}
          path: ${{ runner.temp }}/veritas-release-preview.log

  publish:
    name: Create tag and GitHub release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$VERSION" --title "Veritas $VERSION" --generate-notes)
          if [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target main)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Print release URL
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: gh release view "$VERSION" --json url --jq .url
