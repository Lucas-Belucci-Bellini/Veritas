name: Veritas desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente da release que receberá os instaladores, por exemplo v0.1.0-alpha.1"
        required: true
        type: string
  push:
    tags:
      - "desktop-v*.*.*"

concurrency:
  group: veritas-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows
            os: windows-latest
            args: "--bundles nsis"
            artifact_glob: "Veritas-Setup.exe"
          - platform: macos
            os: macos-latest
            args: "--bundles app,dmg"
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              Veritas_0.1.0-alpha.1_*.app.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Tauri CLI
        run: npm exec -- tauri --version

      - name: Build desktop bundles
        run: npm exec -- tauri build ${{ matrix.args }}

      - name: Normalize Windows installer name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Instalador NSIS não encontrado" }
          Copy-Item $installer.FullName "Veritas-Setup.exe" -Force

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) suffix="aarch64" ;;
            x86_64) suffix="x86_64" ;;
            *) suffix="$arch" ;;
          esac
          ditto -c -k --sequesterRsrc --keepParent "$app" "Veritas_0.1.0-alpha.1_${suffix}.app.zip"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: veritas-desktop-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach desktop installers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^(desktop-)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "A tag precisa ser desktop-vX.Y.Z ou vX.Y.Z: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: veritas-desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd desktop-artifacts
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > SHA256SUMS

      - name: Attach installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Veritas Desktop $RELEASE_TAG" --prerelease --generate-notes
          fi
          while IFS= read -r asset; do
            case "$asset" in
              Veritas_0.1.0-alpha.1_x64-setup.exe|veritas-desktop-*.app.zip|Veritas_0.1.0-alpha.1_*.app.zip)
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes >/dev/null 2>&1 || true
                ;;
            esac
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          find desktop-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
