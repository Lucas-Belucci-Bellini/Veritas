name: Veritas quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tests, build and local smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install HDL toolchains
        run: sudo apt-get update && sudo apt-get install -y iverilog ghdl

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Typecheck frontend and MCP
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build MCP bundle
        run: npm run build:mcp

      - name: MCP interoperability acceptance
        run: npm run beta:mcp

      - name: HDL acceptance
        env:
          HDL_REQUIRE_TOOLCHAINS: '1'
        run: npm run beta:hdl

      - name: Accessibility acceptance
        run: npm run beta:accessibility

      - name: Mobile manual acceptance
        run: npm run beta:mobile

      - name: Rollback acceptance
        env:
          ROLLBACK_CURRENT_TAG: v0.9.0-rc.3
        run: npm run beta:rollback

      - name: Onboarding acceptance
        run: npm run beta:onboarding

      - name: Start production-like preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/veritas-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/veritas-preview.pid"

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/veritas-preview.log"
          exit 1

      - name: HTTP/PWA smoke test
        env:
          SMOKE_URL: http://127.0.0.1:4173
        run: npm run smoke:release

      - name: Upload sanitized acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-acceptance-reports-${{ github.run_id }}
          path: artifacts/*.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-preview-log-${{ github.run_id }}
          path: ${{ runner.temp }}/veritas-preview.log
